- name: Install csharp-ls for .NET
  hosts: localhost
  become: true
  tasks:
    - name: Ensure required packages are installed
      apt:
        name:
          - dotnet-sdk-8.0  # Adjust the version if needed
        state: present
      when: ansible_facts['os_family'] == 'Debian'

    - name: Ensure dotnet tools path is in user's environment
      lineinfile:
        path: ~/.bashrc
        line: 'export PATH="$PATH:$HOME/.dotnet/tools"'
        insertafter: EOF
      become: false

    - name: Install csharp-ls using dotnet tool
      become: false
      shell: |
        export PATH="$PATH:$HOME/.dotnet/tools"
        dotnet tool install --global csharp-ls || dotnet tool update --global csharp-ls
      args:
        executable: /bin/bash

    - name: Verify csharp-ls installation
      become: false
      shell: |
        export PATH="$PATH:$HOME/.dotnet/tools"
        csharp-ls --version
      register: csharp_ls_version
      args:
        executable: /bin/bash

    - name: Display csharp-ls version
      debug:
        msg: "Installed csharp-ls version: {{ csharp_ls_version.stdout }}"

