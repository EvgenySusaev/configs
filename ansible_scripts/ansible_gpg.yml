---
- name: Install GPG and related tools on Ubuntu
  hosts: localhost
  become: yes
  tasks:
    - name: Update apt package index
      apt:
        update_cache: yes

    - name: Install GPG and related utilities
      apt:
        name:
          - gnupg
          - gnupg2
          - gpg-agent
          - pinentry-curses
        state: present

    - name: Install smart card support (for YubiKey)
      apt:
        name:
          - scdaemon
          - pcscd
        state: present

    - name: Ensure pcscd service is running
      service:
        name: pcscd
        state: restarted
        enabled: yes

