---
- name: Install Node.js, npm, Angular CLI, and TypeScript Language Server
  hosts: all
  become: yes
  tasks:
    - name: Update package lists
      apt:
        update_cache: yes
      when: ansible_os_family == "Debian"

    - name: Install prerequisites
      apt:
        name:
          - curl
          - gnupg
        state: present
      when: ansible_os_family == "Debian"

    - name: Add Node.js repository
      shell: |
        curl -fsSL https://deb.nodesource.com/setup_18.x | bash -
      args:
        executable: /bin/bash
      when: ansible_os_family == "Debian"

    - name: Install Node.js and npm
      apt:
        name: nodejs
        state: present
      when: ansible_os_family == "Debian"

    - name: Verify Node.js and npm installation
      command: node -v
      register: node_version
      changed_when: false

    - debug:
        msg: "Node.js version installed: {{ node_version.stdout }}"

    - name: Install Angular CLI globally
      npm:
        name: "@angular/cli"
        global: yes
        state: present

    - name: Install TypeScript Language Server globally
      npm:
        name: "typescript-language-server"
        global: yes
        state: present

    - name: Verify Angular CLI installation
      command: ng version
      register: ng_version
      changed_when: false

    - debug:
        msg: "Angular CLI version: {{ ng_version.stdout }}"

