---
- name: Install Rust and related tools
  hosts: all
  become: yes
  tasks:
    - name: Install required dependencies
      apt:
        name:
          - build-essential
          - curl
          - gcc
          - pkg-config
          - libssl-dev
          - libclang-dev
        state: present
        update_cache: yes

    - name: Check if Rust is already installed
      command: ~/.cargo/bin/rustc --version
      register: rust_installed
      ignore_errors: yes
      changed_when: false

    - name: Download and install Rust using rustup
      shell: |
        curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
      args:
        creates: ~/.cargo/bin/rustc
      become: no
      when: rust_installed.rc != 0

    - name: Ensure Rust is in the PATH for future sessions
      copy:
        dest: /etc/profile.d/rust.sh
        content: 'export PATH="$HOME/.cargo/bin:$PATH"'
        mode: '0755'

    - name: Reload profile to apply PATH changes
      shell: source /etc/profile
      args:
        executable: /bin/bash
      changed_when: false

    - name: Ensure Rust is installed correctly
      command: ~/.cargo/bin/rustc --version
      register: rust_check

    - debug:
        msg: "Rust version installed: {{ rust_check.stdout }}"

