---
- name: Setup development tools and Git for developers (General Playbook)
  hosts: all
  become: yes
  tasks:
  
    # Ensure necessary tools are installed based on the OS family
    - name: Install build-essential (Debian/Ubuntu)
      package:
        name: build-essential
        state: present
      when: ansible_os_family == "Debian"

    - name: Install base-devel (Arch)
      pacman:
        name: base-devel
        state: present
      when: ansible_os_family == "Arch"

    - name: Install development group (RedHat/CentOS/Fedora)
      yum:
        name: "@Development Tools"
        state: present
      when: ansible_os_family == "RedHat"

    # Ensure Git is installed
    - name: Ensure Git is installed
      package:
        name: git
        state: present
      when: ansible_os_family in ['Debian', 'Arch', 'RedHat']

    # Install Zsh shell (alternative to bash)
    - name: Ensure Zsh shell is installed
      package:
        name: zsh
        state: present
      when: ansible_os_family in ['Debian', 'Arch', 'RedHat']

    # Install tmux (terminal multiplexer)
    - name: Ensure tmux is installed
      package:
        name: tmux
        state: present
      when: ansible_os_family in ['Debian', 'Arch', 'RedHat']

    # Install curl
    - name: Ensure curl is installed
      package:
        name: curl
        state: present
      when: ansible_os_family in ['Debian', 'Arch', 'RedHat']

    # Install wget
    - name: Ensure wget is installed
      package:
        name: wget
        state: present
      when: ansible_os_family in ['Debian', 'Arch', 'RedHat']

    # Install NeoVim
    - name: Ensure NeoVim is installed
      package:
        name: neovim
        state: present
      when: ansible_os_family in ['Debian', 'Arch', 'RedHat']

    # Install Emacs
    - name: Ensure Emacs is installed
      package:
        name: emacs
        state: present
      when: ansible_os_family in ['Debian', 'Arch', 'RedHat']

    # Install htop (interactive process viewer)
    - name: Ensure htop is installed
      package:
        name: htop
        state: present
      when: ansible_os_family in ['Debian', 'Arch', 'RedHat']

    # Install tree (visual directory structure viewer)
    - name: Ensure tree is installed
      package:
        name: tree
        state: present
      when: ansible_os_family in ['Debian', 'Arch', 'RedHat']

    # Install ncdu (disk usage analyzer)
    - name: Ensure ncdu is installed
      package:
        name: ncdu
        state: present
      when: ansible_os_family in ['Debian', 'Arch', 'RedHat']

    # Install ripgrep (fast file search tool)
    - name: Ensure ripgrep is installed
      package:
        name: ripgrep
        state: present
      when: ansible_os_family in ['Debian', 'Arch', 'RedHat']

    # Install jq (JSON processor)
    - name: Ensure jq is installed
      package:
        name: jq
        state: present
      when: ansible_os_family in ['Debian', 'Arch', 'RedHat']

    # Install nmap
    - name: Install Nmap on supported systems
      package:
        name: nmap
        state: present
      when: ansible_os_family in ["Debian", "RedHat", "Archlinux"]
