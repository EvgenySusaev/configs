---
- name: Setup Development Environment
  hosts: localhost
  become: true
  vars:
    username: "{{ lookup('env', 'USER') }}"
    user_home: "/home/{{ username }}"
    arch_deb: "{{ 'amd64' if ansible_architecture == 'x86_64' else ansible_architecture }}"
    luarocks_version: "3.11.0"
    nerd_font_name: "JetBrainsMono"
    nerd_font_version: "v3.0.2"
    nerd_font_url: "https://github.com/ryanoasis/nerd-fonts/releases/download/{{ nerd_font_version }}/{{ nerd_font_name }}.zip"

    node_packages:
      - typescript-language-server
      - prettier
      - typescript
      - '@angular/cli'

    rust_tools:
      - rustfmt

    dotnet_tools:
      - csharp-ls

  tasks:
    - name: Update and upgrade apt packages
      ansible.builtin.apt:
        update_cache: yes
        upgrade: dist
      when: ansible_os_family == "Debian"

    - name: Install essential system packages
      ansible.builtin.package:
        name:
          - build-essential
          - git
          - zsh
          - tmux
          - curl
          - wget
          - neovim
          - emacs
          - htop
          - tree
          - ncdu
          - ripgrep
          - jq
          - nmap
          - unzip
          - zip
          - tar
          - iproute2
          - lsof
          - strace
          - traceroute
          - dnsutils
          - gpg
          - pass
          - paperkey
          - screen
          - man-db
          - file
          - make
          - gcc
          - newsboat
          - fzf
          - ranger
        state: present

    - name: Install Docker key dependencies
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
        state: present

    - name: Create Docker keyring directory
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'

    - name: Download Docker GPG key
      ansible.builtin.get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: '0644'

    - name: Ensure lsb-release is installed
      ansible.builtin.package:
        name: lsb-release
        state: present
        
    - name: Debug architecture and distro release
      ansible.builtin.debug:
        msg: "Architecture: {{ arch_deb }}, Release: {{ ansible_distribution_release }}"

        
    - name: Add Docker APT repository
      ansible.builtin.apt_repository:
        repo: "deb [arch={{ arch_deb }} signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
        state: present
        filename: docker
        update_cache: true

    - name: Update apt cache after adding Docker repo
      ansible.builtin.apt:
        update_cache: yes
        
    - name: Install Docker packages
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present

    - name: Install programming languages and toolchains
      ansible.builtin.package:
        name:
          - dotnet-sdk-8.0
          - dotnet-sdk-9.0
          - dotnet-runtime-9.0
          - aspnetcore-runtime-9.0
          - nodejs
          - npm
          - rustc
          - cargo
          - python3
          - python3-pip
          - php
          - perl
          - ruby
          - lua5.1
          - liblua5.1-0-dev
          - clojure
        state: present

    - name: Download and install LuaRocks
      ansible.builtin.shell: |
        wget https://luarocks.github.io/luarocks/releases/luarocks-{{ luarocks_version }}.tar.gz
        tar zxpf luarocks-{{ luarocks_version }}.tar.gz
        cd luarocks-{{ luarocks_version }}
        ./configure --lua-version=5.1 --with-lua-include=/usr/include/lua5.1
        make
        make install
      args:
        chdir: /tmp
        creates: /usr/local/bin/luarocks

    - name: Install global npm packages
      community.general.npm:
        name: "{{ item }}"
        global: yes
      loop: "{{ node_packages }}"

    - name: Install rust-analyzer and rust tools
      ansible.builtin.shell: >
        curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
        && . "{{ user_home }}/.cargo/env"
        && rustup component add rust-analyzer
        {% for tool in rust_tools %}
        && cargo install --locked {{ tool }}
        {% endfor %}
      args:
        executable: /bin/bash
        chdir: "{{ user_home }}"
        creates: "{{ user_home }}/.cargo/env"
      become: false

    - name: Install .NET tools globally
      ansible.builtin.shell: |
        export PATH="$PATH:$HOME/.dotnet/tools"
        dotnet tool install --global {{ item }} || dotnet tool update --global {{ item }}
      args:
        executable: /bin/bash
      loop: "{{ dotnet_tools }}"
      become: false

    - name: Add dotnet tools path to PATH in ~/.bashrc
      ansible.builtin.lineinfile:
        path: "{{ user_home }}/.bashrc"
        line: 'export PATH="$PATH:$HOME/.dotnet/tools"'
        insertafter: EOF
        state: present
      become: false

    - name: Add cargo bin to PATH in ~/.bashrc
      ansible.builtin.lineinfile:
        path: "{{ user_home }}/.bashrc"
        line: 'export PATH="$PATH:$HOME/.cargo/bin"'
        insertafter: EOF
        state: present
      become: false

    - name: Install Nerd Font {{ nerd_font_name }}
      ansible.builtin.shell: |
        mkdir -p ~/.local/share/fonts
        wget -O ~/.local/share/fonts/{{ nerd_font_name }}.zip {{ nerd_font_url }}
        unzip -o ~/.local/share/fonts/{{ nerd_font_name }}.zip -d ~/.local/share/fonts
        rm ~/.local/share/fonts/{{ nerd_font_name }}.zip
        fc-cache -fv
      args:
        executable: /bin/bash
      become: false

