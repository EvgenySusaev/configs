---
- name: Setup Development Environment
  hosts: localhost
  become: true
  vars:
    username: "{{ lookup('env', 'USER') }}"
    user_home: "/home/{{ username }}"
    arch_deb: "{{ 'amd64' if ansible_architecture == 'x86_64' else ansible_architecture }}"

    lazygit_version: "0.62.2"
    delta_version: "0.19.2"

    node_packages:
      - prettier
      - typescript
      - '@angular/cli'
      # NOTE: 'obsidian-headless' is not a known npm package — verify the correct name.
      # - obsidian-headless

    rust_tools:
      - rustfmt

    dotnet_tools:
      - csharp-ls

  tasks:

    # ─────────────────────────────────────────────
    # SYSTEM UPDATE
    # ─────────────────────────────────────────────

    - name: Update and upgrade apt packages
      ansible.builtin.apt:
        update_cache: yes
        upgrade: dist
      when: ansible_os_family == "Debian"

    # ─────────────────────────────────────────────
    # CORE SYSTEM TOOLS
    # ─────────────────────────────────────────────

    - name: Install core system utilities
      ansible.builtin.package:
        name:
          - build-essential
          - make
          - gcc
          - cmake
          - pkg-config
          - git
          - curl
          - wget
          - unzip
          - zip
          - tar
          - rsync
          - pv
          - file
          - man-db
          - screen
          - tmux
        state: present

    # ─────────────────────────────────────────────
    # SHELL & TERMINAL EXPERIENCE
    # ─────────────────────────────────────────────

    - name: Install shell and terminal tools
      ansible.builtin.package:
        name:
          - vim
          - emacs
          - htop
          - tree
          - ncdu
          - ripgrep
          - fd-find          # fast find replacement; binary is 'fdfind' on Ubuntu
          - fzf              # fuzzy finder — integrates with bash history
          - bat              # cat with syntax highlighting; binary is 'batcat' on Ubuntu
          - jq
          - xxd
          - ranger
          - newsboat
        state: present

    # ─────────────────────────────────────────────
    # NETWORK & SECURITY
    # ─────────────────────────────────────────────

    - name: Install network and security tools
      ansible.builtin.package:
        name:
          - nmap
          - iproute2
          - lsof
          - tcpdump
          - strace
          - ltrace
          - traceroute
          - mtr              # better traceroute — real-time combined view
          - dnsutils         # provides dig, nslookup
          - whois
          - ncat             # netcat (nmap's nc)
          - socat
          - openssl
          - gnupg2
          - gpg
          - pass
          - paperkey
          - wireguard
          - openssh-server
          - fail2ban
          - ufw
          - iptables-persistent
          - apparmor-utils
          - yubikey-manager
          - keepassxc
          # NOTE: yubikey-manager may need the Yubico PPA on older Ubuntu releases:
          #   sudo add-apt-repository ppa:yubico/stable
        state: present

    # ─────────────────────────────────────────────
    # SYSTEM MONITORING
    # ─────────────────────────────────────────────

    - name: Install system monitoring tools
      ansible.builtin.package:
        name:
          - sysstat          # iostat, mpstat, sar
          - iotop            # disk I/O by process
          - nethogs          # network traffic by process
          - smartmontools    # S.M.A.R.T. disk health — important for laptop-based server
          - acl
          - logrotate
        state: present

    # ─────────────────────────────────────────────
    # DEBUGGING & BINARY ANALYSIS
    # ─────────────────────────────────────────────

    - name: Install debugging and analysis tools
      ansible.builtin.package:
        name:
          - gdb
          - valgrind
          - clang
          - clang-format
        state: present

    # ─────────────────────────────────────────────
    # DATABASES (clients only)
    # ─────────────────────────────────────────────

    - name: Install database clients
      ansible.builtin.package:
        name:
          - sqlite3
          - postgresql-client  # psql without full server
          - redis-tools        # redis-cli
        state: present

    # ─────────────────────────────────────────────
    # DOCKER
    # ─────────────────────────────────────────────

    - name: Install Docker key dependencies
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
          - lsb-release
        state: present

    - name: Create Docker keyring directory
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'

    - name: Download Docker GPG key
      ansible.builtin.get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: '0644'

    - name: Debug architecture and distro release
      ansible.builtin.debug:
        msg: "Architecture: {{ arch_deb }}, Release: {{ ansible_distribution_release }}"

    - name: Add Docker APT repository
      ansible.builtin.apt_repository:
        repo: "deb [arch={{ arch_deb }} signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
        state: present
        filename: docker
        update_cache: true

    - name: Update apt cache after adding Docker repo
      ansible.builtin.apt:
        update_cache: yes

    - name: Install Docker packages
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present

    - name: Add user to docker group
      ansible.builtin.user:
        name: "{{ username }}"
        groups: docker
        append: yes
      # NOTE: requires re-login or 'newgrp docker' to take effect in current session

    # ─────────────────────────────────────────────
    # PROGRAMMING LANGUAGES & RUNTIMES
    # ─────────────────────────────────────────────

    - name: Install programming languages and toolchains
      ansible.builtin.package:
        name:
          - dotnet-sdk-8.0
          - dotnet-sdk-9.0
          # NOTE: dotnet-sdk-10.0 is preview — requires the preview MS feed. Remove if not needed.
          # - dotnet-sdk-10.0
          - nodejs
          - npm
          - rustc
          - cargo
          - python3
          - python3-pip
          - python3-venv      # virtual environments — avoids --break-system-packages on every install
          - python3-dev       # C extension headers — required for psycopg2, pygame, etc.
          - libpq-dev         # PostgreSQL headers — required for psycopg2
          - pipx              # isolated Python CLI tools
          - php
          - perl
          - ruby
          - lua5.1
          - liblua5.1-0-dev
          - clojure
        state: present

    # ─────────────────────────────────────────────
    # .NET TOOLS
    # ─────────────────────────────────────────────

    - name: Install dotnet-ef tool globally
      ansible.builtin.command:
        cmd: dotnet tool install --global dotnet-ef
      register: dotnet_ef_result
      changed_when: "'was successfully installed' in dotnet_ef_result.stdout"
      failed_when:
        - dotnet_ef_result.rc != 0
        - "'already installed' not in dotnet_ef_result.stderr"
      become: false

    - name: Install .NET tools globally
      ansible.builtin.shell: |
        export PATH="$PATH:$HOME/.dotnet/tools"
        dotnet tool install --global {{ item }} || dotnet tool update --global {{ item }}
      args:
        executable: /bin/bash
      loop: "{{ dotnet_tools }}"
      become: false

    - name: Add dotnet tools path to PATH in ~/.bashrc
      ansible.builtin.lineinfile:
        path: "{{ user_home }}/.bashrc"
        line: 'export PATH="$PATH:$HOME/.dotnet/tools"'
        state: present
      become: false

    # ─────────────────────────────────────────────
    # NODE.JS TOOLS
    # ─────────────────────────────────────────────

    - name: Install global npm packages
      # NOTE: requires the 'community.general' collection:
      #   ansible-galaxy collection install community.general
      community.general.npm:
        name: "{{ item }}"
        global: yes
      loop: "{{ node_packages }}"

    # ─────────────────────────────────────────────
    # RUST TOOLCHAIN
    # ─────────────────────────────────────────────

    - name: Install rustup (bootstrap)
      ansible.builtin.shell: >
        curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
      args:
        executable: /bin/bash
        chdir: "{{ user_home }}"
        creates: "{{ user_home }}/.cargo/env"
      become: false

    - name: Add rust-analyzer component
      ansible.builtin.shell: |
        . "{{ user_home }}/.cargo/env"
        rustup component add rust-analyzer
      args:
        executable: /bin/bash
        chdir: "{{ user_home }}"
      become: false

    - name: Install cargo-based rust tools
      ansible.builtin.shell: |
        . "{{ user_home }}/.cargo/env"
        cargo install --locked {{ item }}
      args:
        executable: /bin/bash
        chdir: "{{ user_home }}"
      loop: "{{ rust_tools }}"
      become: false

    - name: Add cargo bin to PATH in ~/.bashrc
      ansible.builtin.lineinfile:
        path: "{{ user_home }}/.bashrc"
        line: 'export PATH="$PATH:$HOME/.cargo/bin"'
        state: present
      become: false

    # ─────────────────────────────────────────────
    # THIRD-PARTY TOOLS (GitHub releases)
    # ─────────────────────────────────────────────

    - name: Download lazygit
      ansible.builtin.get_url:
        url: "https://github.com/jesseduffield/lazygit/releases/download/v{{ lazygit_version }}/lazygit_{{ lazygit_version }}_Linux_x86_64.tar.gz"
        dest: "/tmp/lazygit.tar.gz"
        mode: '0644'

    - name: Install lazygit
      ansible.builtin.unarchive:
        src: /tmp/lazygit.tar.gz
        dest: /usr/local/bin
        include:
          - lazygit
        remote_src: yes
        mode: '0755'

    - name: Download delta (git-delta)
      ansible.builtin.get_url:
        url: "https://github.com/dandavison/delta/releases/download/{{ delta_version }}/delta-{{ delta_version }}-x86_64-unknown-linux-gnu.tar.gz"
        dest: "/tmp/delta.tar.gz"
        mode: '0644'

    - name: Install delta binary
      ansible.builtin.shell: |
        tar -xzf /tmp/delta.tar.gz -C /tmp
        cp /tmp/delta-{{ delta_version }}-x86_64-unknown-linux-gnu/delta /usr/local/bin/delta
        chmod 0755 /usr/local/bin/delta
      args:
        executable: /bin/bash
        creates: /usr/local/bin/delta

    # ─────────────────────────────────────────────
    # GIT CONFIGURATION
    # ─────────────────────────────────────────────

    - name: Configure git to use delta as pager
      community.general.git_config:
        name: "{{ item.key }}"
        value: "{{ item.value }}"
        scope: global
      loop:
        - { key: "core.pager",          value: "delta" }
        - { key: "interactive.diffFilter", value: "delta --color-only" }
        - { key: "delta.navigate",      value: "true" }
        - { key: "delta.side-by-side",  value: "true" }
        - { key: "merge.conflictstyle", value: "diff3" }
        - { key: "diff.colorMoved",     value: "default" }
      become: false
      # NOTE: set user.name and user.email separately — they are personal and
      # should not be hardcoded in a shared playbook.

    # ─────────────────────────────────────────────
    # SHELL ALIASES (fdfind / batcat → fd / bat)
    # ─────────────────────────────────────────────

    - name: Add fd alias (fdfind -> fd) to ~/.bashrc
      ansible.builtin.lineinfile:
        path: "{{ user_home }}/.bashrc"
        line: "alias fd='fdfind'"
        state: present
      become: false

    - name: Add bat alias (batcat -> bat) to ~/.bashrc
      ansible.builtin.lineinfile:
        path: "{{ user_home }}/.bashrc"
        line: "alias bat='batcat'"
        state: present
      become: false

    - name: Add fzf bash integration to ~/.bashrc
      ansible.builtin.lineinfile:
        path: "{{ user_home }}/.bashrc"
        line: 'eval "$(fzf --bash)"'
        state: present
      become: false
